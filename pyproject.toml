[project]
name = "clickclick"
version = "1.0.0"
description = "Enregistreur et rejoueur d'inputs souris/clavier pour Windows, avec overlay flottant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pynput>=1.8.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
