[project]
name = "clickclick"
version = "1.2.0"  # doit rester aligné sur version.py (voir tests/test_version.py)
description = "Record and replay mouse and keyboard input on Windows, from a floating always-on-top overlay."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

dependencies = [
    "pynput>=1.8.1",
]

[project.urls]
Homepage = "https://github.com/Shult/click_click"
Releases = "https://github.com/Shult/click_click/releases"
Issues = "https://github.com/Shult/click_click/issues"

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
