name: Feature request
description: Suggest something ClickClick should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation first, the feature second — there may be a simpler way to get there.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
