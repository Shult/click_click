[project]
name = "clickclick"
version = "1.2.0"  # doit rester aligné sur version.py (voir tests/test_version.py)
description = "Enregistreur et rejoueur d'inputs souris/clavier pour Windows, avec overlay flottant."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pynput>=1.8.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
